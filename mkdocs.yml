site_name: TNFR Python Engine
site_description: Canonical documentation for the TNFR Python Engine
site_url: https://fermga.github.io/TNFR-Python-Engine/
repo_url: https://github.com/fermga/TNFR-Python-Engine
repo_name: fermga/TNFR-Python-Engine
docs_dir: build/docs-source
site_dir: site
strict: true

# These repository-owned guides/configurations are intentionally staged. Keep
# their paths so relative links work in both GitHub and the generated site.
exclude_docs: |
  !.github/
  !.github/**
  !.pre-commit-config.yaml

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - docs/assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js

nav:
  - Home: index.md
  - Contributor and agent instructions: AGENTS.md
  - Architecture: ARCHITECTURE.md
