name: Package Publication

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to PyPI'
        required: false
        default: false
        type: boolean

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # For trusted publishing to PyPI
    
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "build>=1,<2" "twine>=6,<8"
    
    - name: Verify publication metadata and release tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os
        import tomllib
        from pathlib import Path
        from scripts.check_documentation import check_publication_metadata

        check_publication_metadata()
        version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
        tag = os.environ.get("RELEASE_TAG")
        if tag and tag != f"v{version}":
            raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
        PY

    - name: Build distribution
      run: python -m build
    
    - name: Check distribution
      run: python -m twine check dist/*
    
    - name: Publish to PyPI
      if: github.event_name == 'release' || inputs.force_publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
    
    - name: External Zenodo integration reminder
      if: github.event_name == 'release'
      run: |
        echo "This workflow does not upload to or verify Zenodo."
        echo "A separately configured GitHub-Zenodo integration may archive this release."
