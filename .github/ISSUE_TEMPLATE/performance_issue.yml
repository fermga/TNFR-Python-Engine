name: Performance issue
description: Report a reproducible slowdown or optimization opportunity
title: "[PERF] "
labels: ["performance", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include the exact version and workload; a fixed time target is not
        assumed. See CONTRIBUTING.md and TESTING.md for validation guidance.
        Remove secrets and sensitive data from reproductions.
  - type: input
    id: component
    attributes:
      label: Affected component
      description: Name the public API or command being measured.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducer and expected behavior
      description: Include executable setup, graph size/support, state, seeds and command.
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements and comparison
      description: Include repetitions, timing method, warm or cold caches, actual results and comparison baseline.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Record TNFR version or commit, Python, dependency/backend versions, OS and relevant hardware.
    validations:
      required: true
  - type: textarea
    id: profiling
    attributes:
      label: Optional profiling, workaround or proposed fix
      description: Include accuracy or behavior differences if comparing alternate implementations.
