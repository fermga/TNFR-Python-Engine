name: New domain pattern
description: Propose a structural pattern with explicit assumptions and evidence
title: "[PATTERN] "
labels: ["enhancement", "pattern", "community"]
body:
  - type: markdown
    attributes:
      value: |
        A pattern proposal may be exploratory. Diagnostic scores do not establish
        empirical validity and there is no universal score or case-count gate.
        Distinguish a domain interpretation from a tested prediction.
  - type: input
    id: domain
    attributes:
      label: Domain and pattern name
      placeholder: "network transport / held-source relaxation"
    validations:
      required: true
  - type: textarea
    id: sequence
    attributes:
      label: Operator sequence and context
      description: Use implemented operator identifiers; declare full word or fragment, initial triad, support and admission conditions.
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Domain interpretation and measurements
      description: Define the measured quantities, observation map, units and assumptions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and limitations
      description: Provide available examples, commands, actual diagnostics and countercontrols. State what is untested.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation plan
      description: Explain how calibration is separated from reserved predictions and how the proposal could fail.
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Existing mechanisms to reuse
      description: Link related patterns, source owners or studies to avoid duplicate implementations.
