name: Domain extension
description: Propose an application extension with a testable scope
title: "[EXTENSION] "
labels: ["enhancement", "extension", "community"]
body:
  - type: markdown
    attributes:
      value: |
        Describe a proposal; a complete package is not required at issue creation.
        Use existing public interfaces where possible. Neither a diagnostic
        health score nor a domain analogy proves the application works.
  - type: input
    id: domain
    attributes:
      label: Domain name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
      description: State the concrete task and the proposed measurable benefit.
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Structural model and observation map
      description: Define inputs, units, graph construction, EPI, capacity, phase and supplied laws; distinguish assumptions from derivations.
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Reuse and proposed interface
      description: Identify existing APIs, patterns and data formats; label any new interface as proposed.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Evidence and validation plan
      description: Include controls, calibration/evaluation separation, failure criteria, available data and untested claims.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Data and operational boundaries
      description: Describe relevant data permissions, external services, trust boundaries and compatibility needs.
  - type: input
    id: maintainer
    attributes:
      label: Proposed maintainer, if known
